
{% extends 'main.html' %}

{% block title %}Update Vegetable{% endblock title %}

{% block content %}
    <div class="form-container">
        <form method="post" enctype="multipart/form-data">
            <h2>Update Vegetable</h2>
            {% csrf_token %}
            {{form.as_p}}
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% url 'price_list' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
{% endblock %}
