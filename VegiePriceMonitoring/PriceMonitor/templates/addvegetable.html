
{% extends 'main.html' %}

{% block title %}Add Vegetable{% endblock title %}

{% block content %}
    <div class="form-container">
        <form method="post" enctype="multipart/form-data">
            <h2>Add Vegetable</h2>
            {% csrf_token %}
            {% for field in form %}
                <div>
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    
                    {% if field.errors%}
                        <div class="error" style="color: red;">
                            {% for error in field.errors %}
                                <p>{{ error }}</p>
                            {% endfor %}
                        </div>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% url 'price_list' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
{% endblock %}
